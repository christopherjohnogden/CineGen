<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Studio menu preview</title>
<style>
  :root {
    --bg-void: #08090c;
    --bg-raised: #13161e;
    --bg-overlay: #1f2433;
    --text-primary: #f4f5f7;
    --text-secondary: #b8bcc8;
    --text-tertiary: #8b8f9a;
    --border-subtle: rgba(255, 255, 255, 0.06);
    --studio-popover: #12141b;
    --studio-popover-border: rgba(255, 255, 255, 0.10);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    padding: 48px;
    background: var(--bg-void);
    font-family: Outfit, Inter, system-ui, sans-serif;
    display: flex;
    gap: 36px;
    align-items: flex-end;
  }
  .space-studio__pill-menu {
    position: relative;
    min-width: 176px;
    margin: 0;
    padding: 6px;
    border: 1px solid var(--studio-popover-border);
    border-radius: 18px;
    background: var(--studio-popover);
    box-shadow: 0 18px 44px rgb(0 0 0 / 55%);
    list-style: none;
  }
  .space-studio__pill-menu[role="listbox"]::before {
    content: attr(aria-label);
    display: block;
    padding: 8px 10px 6px;
    color: var(--text-tertiary);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .12em;
    text-transform: uppercase;
  }
  .space-studio__pill-menu button {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 40px;
    padding: 0 12px;
    border: 0;
    border-radius: 12px;
    background: transparent;
    color: var(--text-primary);
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
  }
  .space-studio__pill-menu button > svg {
    flex: none;
    width: 16px;
    height: 16px;
    color: var(--text-secondary);
  }
  .space-studio__pill-menu button.is-active,
  .space-studio__pill-menu button[aria-checked="true"] {
    background: var(--bg-overlay);
  }
  .space-studio__pill-menu button.is-active > svg,
  .space-studio__pill-menu button[aria-checked="true"] > svg {
    color: var(--text-primary);
  }
  .space-studio__pill-menu--grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    min-width: 232px;
    padding: 4px 6px 6px;
  }
  .space-studio__pill-menu--grid::before { grid-column: 1 / -1; padding: 8px 10px 8px; }
  .space-studio__pill-menu--grid li { display: flex; min-width: 0; }
  .space-studio__pill-menu--grid li:nth-child(odd) { border-right: 1px solid var(--border-subtle); }
  .space-studio__pill-menu--grid li:nth-child(n+3) { border-top: 1px solid var(--border-subtle); }
  .space-studio__pill-menu--grid button {
    flex: 1;
    min-height: 44px;
    margin: 3px;
    padding: 0 10px;
    border-radius: 10px;
    justify-content: flex-start;
    gap: 8px;
  }
  .bar {
    display: flex;
    gap: 8px;
    padding: 10px;
    border-radius: 18px;
    background: #0e1016;
  }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 42px;
    padding: 0 14px;
    border-radius: 13px;
    background: var(--bg-overlay);
    color: var(--text-primary);
    font-size: 14px;
    font-weight: 600;
  }
  .col { display: grid; gap: 10px; justify-items: start; }
</style>
</head>
<body>
  <div class="col">
    <div class="space-studio__pill-menu" role="menu" aria-label="Video guidance">
      <button type="button">
        <svg viewBox="0 0 16 16"><rect x="1.6" y="3.6" width="12.8" height="8.8" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M5.2 3.6v8.8M10.8 3.6v8.8" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
        <span>Frames</span>
      </button>
      <button type="button" class="is-active" aria-checked="true">
        <svg viewBox="0 0 16 16"><rect x="1.7" y="5.2" width="3.4" height="7.6" rx="0.9" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="6.3" y="2.4" width="3.4" height="10.4" rx="0.9" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="10.9" y="4" width="3.4" height="8.8" rx="0.9" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
        <span>References</span>
      </button>
      <button type="button">
        <svg viewBox="0 0 16 16"><circle cx="4" cy="12" r="2.1" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="12" cy="12" r="2.1" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M5.4 10.4 12 2M10.6 10.4 4 2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <span>Edit video</span>
      </button>
    </div>
    <div class="bar"><span class="pill">References ⌄</span></div>
  </div>
  <div class="col">
    <ul class="space-studio__pill-menu space-studio__pill-menu--grid" role="listbox" aria-label="Aspect ratio" id="ratios"></ul>
    <div class="bar"><span class="pill">▭ 16:9</span></div>
  </div>
  <div class="col">
    <ul class="space-studio__pill-menu" role="listbox" aria-label="Resolution">
      <li><button type="button"><span>480p</span></button></li>
      <li><button type="button" class="is-active"><span>720p</span></button></li>
      <li><button type="button"><span>1080p</span></button></li>
    </ul>
    <div class="bar"><span class="pill">◇ 720p</span></div>
  </div>
<script>
  const ratios = ['21:9', '16:9', '4:3', '1:1', '3:4', '9:16'];
  document.getElementById('ratios').innerHTML = ratios.map((value) => {
    const [w, h] = value.split(':').map(Number);
    const scale = 12.4 / Math.max(w, h);
    const width = w * scale;
    const height = h * scale;
    const active = value === '16:9' ? ' class="is-active"' : '';
    return `<li><button type="button"${active}>`
      + `<svg viewBox="0 0 16 16"><rect x="${(16-width)/2}" y="${(16-height)/2}" width="${width}" height="${height}" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>`
      + `<span>${value}</span></button></li>`;
  }).join('');
</script>
</body>
</html>
